# Custom PostgreSQL queries for postgres_exporter
# These supplement the default metrics with application-specific insights

pg_stat_activity_max_tx_duration:
  query: |
    SELECT datname,
           COALESCE(MAX(EXTRACT(EPOCH FROM (now() - xact_start))), 0) AS max_tx_duration
    FROM pg_stat_activity
    WHERE state != 'idle'
      AND datname NOT IN ('postgres', 'template0', 'template1')
    GROUP BY datname
  metrics:
    - datname:
        usage: "LABEL"
        description: "Database name"
    - max_tx_duration:
        usage: "GAUGE"
        description: "Maximum duration of active transactions in seconds"

pg_stat_table_bloat:
  query: |
    SELECT schemaname, tablename,
           pg_total_relation_size(quote_ident(schemaname) || '.' || quote_ident(tablename)) AS total_bytes,
           pg_relation_size(quote_ident(schemaname) || '.' || quote_ident(tablename)) AS table_bytes
    FROM pg_tables
    WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
  metrics:
    - schemaname:
        usage: "LABEL"
        description: "Schema name"
    - tablename:
        usage: "LABEL"
        description: "Table name"
    - total_bytes:
        usage: "GAUGE"
        description: "Total bytes including indexes and toast"
    - table_bytes:
        usage: "GAUGE"
        description: "Table size in bytes"

pg_connections_by_state:
  query: |
    SELECT state, COUNT(*) AS count
    FROM pg_stat_activity
    WHERE datname NOT IN ('postgres', 'template0', 'template1')
    GROUP BY state
  metrics:
    - state:
        usage: "LABEL"
        description: "Connection state"
    - count:
        usage: "GAUGE"
        description: "Number of connections in this state"

pg_slow_queries:
  query: |
    SELECT
      datname,
      COUNT(*) AS count
    FROM pg_stat_activity
    WHERE state != 'idle'
      AND datname NOT IN ('postgres', 'template0', 'template1')
      AND EXTRACT(EPOCH FROM (now() - query_start)) > 5
    GROUP BY datname
  metrics:
    - datname:
        usage: "LABEL"
        description: "Database name"
    - count:
        usage: "GAUGE"
        description: "Number of queries running longer than 5 seconds"
