server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ─── Docker container logs ──────────────────────────────────────────
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: status
            values: ["running"]
    relabel_configs:
      # Use container name as the service label
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      # Map well-known container names to service labels
      - source_labels: [container]
        target_label: service
      # Keep only app containers (exclude monitoring stack itself for cleanliness)
      - source_labels: [container]
        regex: (user-service|product-service|catalog-service|order-service|payment-service|shipping-service|review-service|notification-service|api-gateway|service-discovery|kafka|frontend)
        action: keep
      # Add Docker image label
      - source_labels: [__meta_docker_container_image]
        target_label: image
      # Add log stream label
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream

    pipeline_stages:
      # Parse Spring Boot log format:
      # 2024-01-01 12:00:00 [main] [correlationId123] INFO  c.e.UserService - message
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\s+\[(?P<thread>[^\]]+)\]\s+\[?(?P<correlationId>[^\]\s]*)\]?\s+(?P<level>\w+)\s+(?P<logger>\S+)\s+-\s+(?P<message>.*)'
      # Only bounded-cardinality fields may become stream labels. correlationId
      # and traceId are unique per request and thread is near-unique; promoting
      # them would create a new Loki stream per request. They are attached as
      # structured metadata instead, which stays queryable without the
      # cardinality cost.
      - labels:
          level:
      - structured_metadata:
          correlationId:
          thread:
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05"
          location: "UTC"
      # Drop DEBUG logs to reduce volume (keep INFO/WARN/ERROR)
      - match:
          selector: '{service=~".+"}'
          stages:
            - drop:
                expression: '.*\bDEBUG\b.*'
                drop_counter_reason: debug_log_dropped
      # Extract traceId from JSON structured logs if present
      - match:
          selector: '{service=~".+"}'
          stages:
            - regex:
                expression: '"traceId"\s*:\s*"(?P<traceId>[a-f0-9]+)"'
            - structured_metadata:
                traceId:
