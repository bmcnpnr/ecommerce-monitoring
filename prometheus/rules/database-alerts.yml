groups:
  - name: database.postgres
    interval: 30s
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down ({{ $labels.database }})"
          description: "PostgreSQL exporter for {{ $labels.database }} reports the database is unreachable."

      - alert: PostgresTooManyConnections
        # max_connections is server-scoped and carries no datname label, so the
        # previous 'sum by (datname, instance)' on both sides produced an empty
        # datname on the denominator and never matched. Connections are summed
        # across databases and compared per instance.
        expr: |
          sum by (instance) (pg_stat_activity_count)
          /
          on(instance) group_left max by (instance) (pg_settings_max_connections)
          > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL instance {{ $labels.instance }} has too many connections"
          description: "Connection usage is {{ $value | humanizePercentage }} of max_connections."

      - alert: PostgresDeadlocks
        expr: rate(pg_stat_database_deadlocks{datname!~"template.*|postgres"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL deadlocks detected on {{ $labels.datname }}"
          description: "Deadlock rate: {{ $value }} per second on database {{ $labels.datname }}."

      - alert: PostgresSlowQueries
        # Two fixes: the custom query in queries.yml emits
        # <query-key>_<column>, i.e. pg_stat_activity_max_tx_duration_max_tx_duration;
        # and the metric is a gauge in seconds, so rate() over it could never
        # exceed 60. Compare the gauge directly.
        expr: |
          pg_stat_activity_max_tx_duration_max_tx_duration{datname!~"template.*|postgres"} > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Long-running queries on {{ $labels.datname }}"
          description: "There are queries running for more than 60 seconds on {{ $labels.datname }}."

  # catalogdb is MongoDB (catalog-service's read model), scraped through
  # percona/mongodb_exporter; see prometheus.yml job mongodb-exporter-catalogdb.
  - name: database.mongodb
    interval: 30s
    rules:
      - alert: MongoDown
        expr: mongodb_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MongoDB is down ({{ $labels.database }})"
          description: "mongodb_exporter for {{ $labels.database }} cannot reach the server."

      - alert: MongoTooManyConnections
        # serverStatus.connections: current in use vs. available headroom
        # (mongodb_ss_* are the exporter's diagnosticdata metrics).
        expr: |
          sum by (instance) (mongodb_ss_connections{conn_type="current"})
          /
          (
            sum by (instance) (mongodb_ss_connections{conn_type="current"})
            + sum by (instance) (mongodb_ss_connections{conn_type="available"})
          )
          > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MongoDB instance {{ $labels.instance }} has too many connections"
          description: "Connection usage is {{ $value | humanizePercentage }} of the server's connection limit."
