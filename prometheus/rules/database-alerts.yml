groups:
  - name: database.postgres
    interval: 30s
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down ({{ $labels.database }})"
          description: "PostgreSQL exporter for {{ $labels.database }} reports the database is unreachable."

      - alert: PostgresTooManyConnections
        expr: |
          sum by (datname, instance) (pg_stat_activity_count)
          /
          sum by (datname, instance) (pg_settings_max_connections)
          > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL {{ $labels.database }} has too many connections"
          description: "Connection usage is {{ $value | humanizePercentage }} of max_connections."

      - alert: PostgresDeadlocks
        expr: rate(pg_stat_database_deadlocks{datname!~"template.*|postgres"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL deadlocks detected on {{ $labels.datname }}"
          description: "Deadlock rate: {{ $value }} per second on database {{ $labels.datname }}."

      - alert: PostgresReplicationLag
        expr: pg_replication_lag > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL replication lag is high"
          description: "Replication lag is {{ $value }}s on {{ $labels.instance }}."

      - alert: PostgresSlowQueries
        expr: |
          rate(pg_stat_activity_max_tx_duration{datname!~"template.*|postgres"}[5m]) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Long-running queries on {{ $labels.datname }}"
          description: "There are queries running for more than 60 seconds on {{ $labels.datname }}."
