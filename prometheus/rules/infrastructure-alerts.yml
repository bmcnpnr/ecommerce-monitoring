groups:
  - name: infrastructure.containers
    interval: 30s
    rules:
      - alert: ContainerHighCpuUsage
        # The value is in cores, not a ratio, so it is rendered as cores too —
        # humanizePercentage here would have reported "80%" for 0.8 cores.
        expr: |
          sum(rate(container_cpu_usage_seconds_total{name!="", name!~".*prometheus.*|.*grafana.*|.*cadvisor.*"}[5m])) by (name)
          > 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage for container {{ $labels.name }}"
          description: "Container {{ $labels.name }} is using {{ $value | printf \"%.2f\" }} CPU cores."

      - alert: ContainerHighMemoryUsage
        # The '> 0' guard is essential: containers without a mem_limit report a
        # limit of 0, and dividing by it yields +Inf, which trips this alert for
        # every such container permanently.
        expr: |
          (
            container_memory_usage_bytes{name!=""}
            / on(name) container_spec_memory_limit_bytes{name!=""}
          ) > 0.85
          and on(name) container_spec_memory_limit_bytes{name!=""} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage for container {{ $labels.name }}"
          description: "Container {{ $labels.name }} memory usage is {{ $value | humanizePercentage }} of its limit."

      - alert: ContainerRestarting
        # container_start_time_seconds increasing is the whole signal. The old
        # first clause, rate(container_last_seen[5m]) > 0, is a timestamp gauge
        # that always advances ~1s/s and so was always true.
        expr: |
          increase(container_start_time_seconds{name!=""}[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is restarting"
          description: "Container {{ $labels.name }} has restarted recently."

  # node-exporter runs inside the Docker engine's Linux VM, so on Docker Desktop
  # these describe that VM's resources, not the Windows/macOS host. Wording is
  # deliberate — treating them as host metrics leads to chasing phantom alerts.
  - name: infrastructure.host
    interval: 30s
    rules:
      - alert: HostHighCpuLoad
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU load in the Docker VM ({{ $labels.instance }})"
          description: "Docker VM CPU usage is {{ $value | printf \"%.1f\" }}% (threshold: 80%)."

      - alert: HostOutOfMemory
        expr: |
          (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Host is running out of memory"
          description: "Only {{ $value | humanizePercentage }} of host memory is available."

      # The three disk rules below select real filesystems by type, not
      # mountpoint="/". On Docker Desktop `/` of the VM is not necessarily the disk that
      # holds /var/lib/docker (the one the 992 GB incident filled), and a selector that
      # matches nothing never fires. tmpfs/ramfs are small by design; overlay, squashfs
      # and nsfs are already excluded by node-exporter. min by (device) folds the
      # several mountpoints of one device (/, /var/lib/docker, /etc/hosts ...) into one
      # alert.
      - alert: HostDiskSpaceLow
        expr: |
          min by (instance, device) (
            node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|iso9660|overlay|nsfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|squashfs|iso9660|overlay|nsfs"}
          ) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low on {{ $labels.device }}"
          description: "Only {{ $value | humanizePercentage }} of {{ $labels.device }} is free. `docker system df` shows what Docker holds; large log or volume growth shows on the Logging & Reliability dashboard."

      - alert: HostDiskSpaceCritical
        expr: |
          min by (instance, device) (
            node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|iso9660|overlay|nsfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|squashfs|iso9660|overlay|nsfs"}
          ) < 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disk space critically low on {{ $labels.device }}"
          description: "Less than 5% of {{ $labels.device }} is free. Immediate action required: a full disk stops every container (and Docker Desktop's WSL2 disk never shrinks again)."

      # Rate-based, because a runaway fills a disk faster than a percentage threshold
      # can warn: 992 GB in 17 h is 58 GB/h, so a 1 TB disk goes from 15 % free to full
      # in under 3 h. The window must be long enough to ignore a `docker build`.
      - alert: HostDiskWillFillWithin24h
        expr: |
          min by (instance, device) (
            predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|iso9660|overlay|nsfs"}[6h], 24 * 3600)
          ) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} will run out of space within 24 hours"
          description: "At the rate of the last 6 hours {{ $labels.device }} is full within a day. Look for runaway logs (ServiceLogRateHigh, ContainerLogVolumeHigh), Kafka or Loki growth."

      - alert: HostDiskWillFillWithin4h
        expr: |
          min by (instance, device) (
            predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|iso9660|overlay|nsfs"}[1h], 4 * 3600)
          ) < 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} will run out of space within 4 hours"
          description: "At the rate of the last hour {{ $labels.device }} is full within 4 hours. This is what a log explosion looks like before the disk is full: find the container writing the most (promtail_custom_log_bytes_total, `docker ps -s`) and stop it."

  # The metrics stores can outgrow their volumes too; each has a size or rate bound
  # (prometheus --storage.tsdb.retention.size, Loki and Tempo ingestion limits), and
  # these rules say when a bound is doing the work.
  - name: infrastructure.monitoring
    interval: 30s
    rules:
      - alert: PrometheusTsdbNearSizeLimit
        # prometheus_tsdb_retention_limit_bytes is 0 when no size limit is set, hence the guard.
        expr: |
          prometheus_tsdb_storage_blocks_bytes / prometheus_tsdb_retention_limit_bytes > 0.9
          and prometheus_tsdb_retention_limit_bytes > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus storage is at {{ $value | humanizePercentage }} of its size limit"
          description: "The TSDB is within 10% of --storage.tsdb.retention.size, so the oldest blocks are about to be deleted before the 15-day retention. Check for a cardinality increase (prometheus_tsdb_head_series) or raise the limit."

      - alert: PrometheusSampleLimitExceeded
        expr: |
          increase(prometheus_target_scrapes_exceeded_sample_limit_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A scrape target exceeded the sample limit"
          description: "A target returned more than 50000 samples (global sample_limit in prometheus.yml), so its scrape failed and the target shows up == 0. A metric label is probably carrying an id; see Status → Targets for the failing job."

      - alert: ExporterDown
        # ServiceDown only selects group="application", and the kafka_brokers, pg_up and
        # mongodb_up alerts depend on their exporter: if the exporter dies the series
        # disappear and those rules stay silent. This one watches the scrape itself.
        expr: |
          up{group=~"infrastructure|messaging|database|frontend"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} exporter is down"
          description: "Prometheus cannot scrape {{ $labels.service }} ({{ $labels.instance }}) for 3 minutes, so the alerts that depend on it cannot fire."
