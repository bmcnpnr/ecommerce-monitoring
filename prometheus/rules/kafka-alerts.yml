groups:
  - name: kafka.health
    interval: 30s
    rules:
      - alert: KafkaBrokerDown
        expr: kafka_brokers < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker is down"
          description: "No Kafka brokers are reachable. All messaging will be impacted."

      - alert: KafkaConsumerGroupLag
        expr: kafka_consumergroup_lag > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer group {{ $labels.consumergroup }} is lagging"
          description: "Consumer group {{ $labels.consumergroup }} on topic {{ $labels.topic }} has a lag of {{ $value }} messages."

      - alert: KafkaConsumerGroupLagCritical
        expr: kafka_consumergroup_lag > 10000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical Kafka consumer lag for {{ $labels.consumergroup }}"
          description: "Consumer group {{ $labels.consumergroup }} on topic {{ $labels.topic }} has a lag of {{ $value }} messages. Processing is severely behind."

      # Replaces a former KafkaTopicOffsetNotGrowing rule that alerted whenever a
      # partition received no messages for 10m. That fired for all 57 partitions
      # of an idle stack (including the 50 internal __consumer_offsets ones) and
      # was never actionable — an idle topic is not an incident.
      - alert: KafkaUnderReplicatedPartitions
        expr: sum(kafka_topic_partition_under_replicated_partition) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka has under-replicated partitions"
          description: "{{ $value }} partition(s) are under-replicated; the broker may be unhealthy or a replica is offline."

      - alert: KafkaPartitionHasNoLeader
        expr: kafka_topic_partition_leader == -1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Kafka partition {{ $labels.topic }}-{{ $labels.partition }} has no leader"
          description: "Producers and consumers for topic {{ $labels.topic }} will fail until a leader is elected."
