groups:
  - name: kafka.health
    interval: 30s
    rules:
      - alert: KafkaBrokerDown
        expr: kafka_brokers < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker is down"
          description: "No Kafka brokers are reachable. All messaging will be impacted."

      - alert: KafkaConsumerGroupLag
        expr: kafka_consumergroup_lag > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer group {{ $labels.consumergroup }} is lagging"
          description: "Consumer group {{ $labels.consumergroup }} on topic {{ $labels.topic }} has a lag of {{ $value }} messages."

      - alert: KafkaConsumerGroupLagCritical
        expr: kafka_consumergroup_lag > 10000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical Kafka consumer lag for {{ $labels.consumergroup }}"
          description: "Consumer group {{ $labels.consumergroup }} on topic {{ $labels.topic }} has a lag of {{ $value }} messages. Processing is severely behind."

      - alert: KafkaTopicOffsetNotGrowing
        expr: rate(kafka_topic_partition_current_offset[5m]) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No messages on Kafka topic {{ $labels.topic }}"
          description: "Topic {{ $labels.topic }} partition {{ $labels.partition }} has not received messages in 10 minutes."
