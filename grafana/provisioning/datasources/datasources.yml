apiVersion: 1

datasources:
  # The uid values are referenced by literal string from the Tempo datasource
  # below (serviceMap, tracesToLogsV2) and from the dashboards, so they must be
  # pinned rather than auto-generated.
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        # Every service logs "... [correlationId] [traceId] LEVEL ..." (32 hex
        # characters between the second pair of brackets, empty outside a trace).
        # A correlation id is a UUID with dashes, so this cannot match one.
        - datasourceUid: tempo
          matcherRegex: '\[([0-9a-f]{32})\]'
          name: TraceID
          url: '$${__value.raw}'

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    uid: tempo
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        # The span's service.name is the `service` stream label promtail sets.
        tags:
          - key: service.name
            value: service
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        # Adds |= "<traceId>" to the query; the id is in every log line.
        filterByTraceID: true
        filterBySpanID: false
      serviceMap:
        datasourceUid: prometheus
      search:
        hide: false
      nodeGraph:
        enabled: true
